[workspace]
resolver = "3"
members = ["crates/core", "crates/host", "crates/input-helper", "crates/panes-mover", "crates/vignette"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
